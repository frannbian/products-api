; Production queue workers (Supervisor). One program per SQS queue: each one
; long polls only its own queue, so an empty queue never delays the others,
; and every queue scales on its own (numprocs).
;
; --max-time restarts workers every hour so memory leaks never pile up;
; stopwaitsecs lets a running job finish (it must exceed the longest timeout).

[program:queue-imports]
command=php /var/www/html/artisan queue:work sqs --queue=imports --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-imports.log

[program:queue-catalog-events]
command=php /var/www/html/artisan queue:work sqs --queue=catalog-events --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-catalog-events.log

[program:queue-mail]
command=php /var/www/html/artisan queue:work sqs --queue=mail --max-time=3600
process_name=%(program_name)s_%(process_num)02d
