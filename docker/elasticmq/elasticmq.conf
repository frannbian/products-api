# Local SQS emulator. Same queues as production SQS, created on startup.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Enforce real SQS limits (message size, delays, batch sizes).
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

# Every queue:
#  - long polls for 20 seconds, so idle workers do not hammer the queue;
#  - hides a received message longer than its jobs may run, so it is not
#    delivered to a second worker while the first one is still on it;
#  - moves a message to its dead letter queue after 5 receives: Laravel
#    stops retrying earlier (tries), so only messages that crash the worker
#    before Laravel can record the failure end up there.
queues {
  default {
    defaultVisibilityTimeout = 90 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "default-dlq", maxReceiveCount = 5 }
  }
  catalog-events {
    defaultVisibilityTimeout = 90 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "catalog-events-dlq", maxReceiveCount = 5 }
  }
  imports {
    defaultVisibilityTimeout = 360 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "imports-dlq", maxReceiveCount = 5 }
  }
  mail {
    defaultVisibilityTimeout = 90 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "mail-dlq", maxReceiveCount = 5 }
  }
  default-dlq {}
  catalog-events-dlq {}
  imports-dlq {}
  mail-dlq {}
}
