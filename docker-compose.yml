services:
  postgres:
    image: postgres:17.4
    container_name: postgres
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - postgres_network

  # Cache, rate limiting and idempotency keys. Used as a cache only: nothing is
  # persisted to disk and, when full, the least recently used keys are evicted.
  redis:
    image: redis:7.4.10-alpine
    container_name: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - redis_network

  # Local SQS (ElasticMQ). In production the app points to AWS SQS instead:
  # only SQS_PREFIX / SQS_ENDPOINT and the AWS credentials change.
  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: sqs
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "${SQS_PORT:-9324}:9324"
      - "${SQS_STATS_PORT:-9325}:9325"
    networks:
      - sqs_network

volumes:
  postgresql_data:
    driver: local

networks:
  postgres_network:
    driver: bridge
  redis_network:
    driver: bridge
  sqs_network:
    driver: bridge
